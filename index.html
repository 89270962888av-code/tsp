<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Комплект ТСП</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Комплект ТСП</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: инженерный рабочий стол — тёмная шапка-«паспорт», полоса итогов, вкладки по шагам: проект → геометрия → нормы → результат */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --sunk:#F5F6F7; --ink:#1C2126; --muted:#5B646E; --line:#CDD2D7; --line2:#E2E5E8;
  --head:#22282E; --head-ink:#F1F3F5; --head-muted:#A8B0B8;
  --accent:#D4500F; --accent-ink:#FFFFFF; --accent-soft:#FBE6DA;
  --ok:#2E7A4E; --warn:#A86A12; --err:#B3261E; --warn-soft:#FDF1DC; --err-soft:#FBE3E1; --info-soft:#E3ECF5;
  --open:#2B5C9E; --post-need:#E07B00; --col:#26508F;
  --f-disp:"Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1C2024; --sunk:#171A1D; --ink:#E6E9EC; --muted:#9AA3AC; --line:#353B41; --line2:#2A2F34;
  --head:#0E1012; --head-ink:#F1F3F5; --head-muted:#8E979F;
  --accent:#F06A28; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --ok:#5CC08A; --warn:#E3A84A; --err:#F2847A; --warn-soft:#33281A; --err-soft:#3A1F1D; --info-soft:#1D2733;
  --open:#7FA8E0; --post-need:#F5A04A; --col:#8DB0E6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --sunk:#171A1D; --ink:#E6E9EC; --muted:#9AA3AC; --line:#353B41; --line2:#2A2F34;
  --head:#0E1012; --head-ink:#F1F3F5; --head-muted:#8E979F;
  --accent:#F06A28; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --ok:#5CC08A; --warn:#E3A84A; --err:#F2847A; --warn-soft:#33281A; --err-soft:#3A1F1D; --info-soft:#1D2733;
  --open:#7FA8E0; --post-need:#F5A04A; --col:#8DB0E6; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
header.top{background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--head-muted);font-size:12px;display:block;margin-top:-3px}
.proj{flex:1 1 260px;min-width:0;display:flex;gap:8px;align-items:center}
.proj input{flex:1;min-width:0;background:transparent;border:1px solid #3B444D;color:var(--head-ink);border-radius:4px;padding:6px 9px;font:inherit}
.proj input:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:500 13px var(--f-body);border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border-color:#3B444D;color:var(--head-ink)}
button.ghost:hover{border-color:var(--head-muted)}
button.small{padding:4px 8px;font-size:12px}
button.danger{color:var(--err)}
button:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}
.kpi{background:var(--surface);padding:10px 14px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.hot .v{color:var(--accent)}
.kpi.bad .v{color:var(--warn)}
nav.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 12px;color:var(--muted);font-weight:500}
nav.tabs button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:2px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:8px 6px}
main{padding-block:16px 48px}
section.tab{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h2,.card h3{font-family:var(--f-disp);font-weight:600;letter-spacing:.02em;margin:0 0 10px;text-wrap:balance}
.card h2{font-size:21px}.card h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-geo{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2,.grid-geo{grid-template-columns:minmax(0,1fr)}}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;background:var(--sunk);transition:border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-disp);font-size:20px;font-weight:600;letter-spacing:.02em}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.thumb{border:1px solid var(--line);border-radius:5px;padding:6px;background:var(--surface);cursor:pointer;position:relative;min-width:0}
.thumb img{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border-radius:3px}
.thumb .cap{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb input{position:absolute;top:10px;left:10px;width:18px;height:18px;accent-color:var(--accent)}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.status{border-radius:5px;padding:10px 12px;background:var(--info-soft);font-size:13px;white-space:pre-wrap}
.status.err{background:var(--err-soft)}
.status.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.wlist{display:grid;gap:6px}
.witem{border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer;background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit}
.witem[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.witem .code{font-family:var(--f-disp);font-size:20px;font-weight:700;min-width:34px;text-align:center;grid-row:span 2}
.witem .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .d{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ext{border-color:var(--col);color:var(--col)}
.chip.part{border-color:var(--muted)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.err{border-color:var(--err);color:var(--err)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.form label,.field{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form .wide{grid-column:span 2}
@media (max-width:520px){.form .wide{grid-column:auto}}
input[type=text],input[type=number],select,textarea{font:13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;background:var(--sunk)}
td input,td select{padding:4px 6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:4px}
.svgbox{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:var(--sunk);padding:8px}
.svgbox svg{display:block;min-width:720px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.flag{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 10px;border-radius:5px;background:var(--warn-soft);align-items:start}
.flag.err{background:var(--err-soft)}
.flag .w{font-family:var(--f-disp);font-weight:700;font-size:16px;min-width:28px}
.truck{display:grid;gap:8px}
.truck-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.truck-head b{font-family:var(--f-disp);font-size:22px;font-weight:700}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;width:140px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.over span{background:var(--err)}
.ptitle{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
details>summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--head);color:var(--head-ink);padding:10px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:13px}
.ralin{display:flex;align-items:center;gap:6px}.ralin .sw{flex:none;width:18px;height:18px;margin:0}
.wcmp td.best{color:var(--ok);font-weight:600}
.subh{font-family:var(--f-disp);font-weight:600;font-size:16px;margin:16px 0 8px;letter-spacing:.02em}
.rule b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
</style>

<script>
/* ===== Расчётное ядро: раскладка ТСП, спецификация, упаковка, загрузка машин ===== */
const DEFAULTS = {
  panel: { maker: "МП ТСП", thickness: 100, width: 1000, lock: "Z-LOCK", core: "МВ", cls: "1", orient: "horizontal",
           maxL: 14000, minL: 2000, gap: 10, metal: 0.5, outer: "7004", inner: "9003", band: "", bandRows: 0, plinth: "", plinthRows: 0, partWidth: 0, sliver: 150,
           corner: "", partColor: "9003", partThickness: 100, rigelStep: 3000, spanWarn: 6000, sealOuter: false },
  roof: { thickness: 150, width: 1000, outer: "7004", inner: "9003", overlap: 300, eave: 100 },
  weight: { steel: 7.85, glue: 0.45, dens: { "МВ": 105, "ППС": 25, "PIR": 40 }, roofExtra: 1.73 },
  pack: { maxH: 1200, foam: 40, roofFeet: 70, maxKg: 3500, roofRib: 40, extraW: 20 },
  truck: { name: "Еврофура тент 20 т", L: 13600, W: 2450, H: 2400, tiers: 3, payload: 20000, overhang: 500 },
  fiPallet: { pcs: 500, maxKg: 1000, L: 2000, H: 600, W: 1200 },
  fix: { wallPerSup: 3, partPerSup: 2, roofPerPurlin: 3, fiStep: 300, anchorStep: 500, roofStitch: 500, cartridgeM: 10, reserve: 5 },
  screws: {
    "Z-LOCK": { 50: 105, 60: 105, 80: 115, 100: 140, 120: 160, 150: 190, 170: 240, 180: 240, 200: 240, 250: 315, 300: 350 },
    "SECRET FIX": { 50: 85, 60: 85, 80: 105, 100: 130, 120: 150, 150: 190 },
    "roof": { 50: 140, 60: 150, 80: 190, 100: 190, 120: 240, 150: 240, 170: 285, 180: 285, 200: 285, 250: 350 },
  },
};

const clone = (o) => JSON.parse(JSON.stringify(o));
const uniqSort = (a) => [...new Set(a.map(Number))].sort((x, y) => x - y);
const r10 = (v) => Math.floor(v / 10) * 10;
const isWin = (t) => /окн|витраж/i.test(t || "");
const isDoor = (t) => /двер|ворот/i.test(t || "");

function kgm2(P, t, core, roof) {
  const dens = P.weight.dens[core] ?? 105;
  return P.weight.steel * (P.panel.metal / 0.5) + dens * t / 1000 + P.weight.glue + (roof ? P.weight.roofExtra : 0);
}
function screwLen(P, kind, t) {
  const tab = kind === "roof" ? P.screws.roof : (P.screws[P.panel.lock] || P.screws["Z-LOCK"]);
  const ks = Object.keys(tab).map(Number).sort((a, b) => a - b);
  const k = ks.find((x) => x >= t) ?? ks[ks.length - 1];
  return tab[k];
}
function desig(P, kind, t, W, outer, inner) {
  const lk = kind === "roof" ? "K" : (P.panel.lock === "SECRET FIX" ? "S" : "Z");
  const m = String(P.panel.metal).replace(".", ",");
  return `${P.panel.maker}-${lk}-${t}-${W}-Н-Н-${P.panel.core}-(ПЭ-01-${outer}-${m}\\ПЭ-01-${inner}-${m})-${P.panel.cls} класс-ГОСТ 32603-2021`;
}

function subIntervals(a, b, holes) {
  let segs = [[a, b]];
  for (const [h0, h1] of [...holes].sort((x, y) => x[0] - y[0])) {
    const nw = [];
    for (const [s0, s1] of segs) {
      if (h1 <= s0 || h0 >= s1) { nw.push([s0, s1]); continue; }
      if (h0 > s0) nw.push([s0, h0]);
      if (h1 < s1) nw.push([h1, s1]);
    }
    segs = nw;
  }
  return segs.filter((s) => s[1] - s[0] > 0);
}

function globalJoints(a, b, cols, maxL, minL) {
  const len = b - a, res = [];
  if (len <= maxL) return res;
  const k = Math.ceil(len / maxL);
  let start = a;
  for (let i = 1; i < k; i++) {
    const target = a + (len * i) / k;
    let cand = cols.filter((c) => c >= start + minL && c <= start + maxL && c <= b - minL);
    if (!cand.length) cand = cols.filter((c) => c > start && c <= start + maxL);
    if (!cand.length) break;
    const pick = cand.reduce((p, c) => (Math.abs(c - target) < Math.abs(p - target) ? c : p));
    res.push(pick); start = pick;
  }
  while (b - start > maxL) {
    const cand = cols.filter((c) => c > start + minL && c <= start + maxL);
    if (!cand.length) break;
    const pick = Math.max(...cand); res.push(pick); start = pick;
  }
  return res;
}

function supportsOf(w) {
  let s = [...(w.columns || []), ...(w.posts || [])];
  for (const o of w.openings || []) { if (o.x0 > w.x0 && o.x0 < w.x1) s.push(o.x0); if (o.x1 > w.x0 && o.x1 < w.x1) s.push(o.x1); }
  if (w.kind === "part") s.push(w.x0, w.x1);
  return uniqSort(s);
}

/* --- горизонтальная раскладка стены --- */
function layoutHorizontal(w, P, flags) {
  const W = w.kind === "part" ? (P.panel.partWidth || P.panel.width) : P.panel.width;
  const H = w.height, rise = w.gable && w.gable.rise > 0 ? w.gable.rise : 0, Ht = H + rise;
  let n = Math.ceil(Ht / W - 1e-9);
  const lastH = H - Math.floor(H / W - 1e-9) * W;
  if (!rise && n > 1 && lastH > 0 && lastH < (P.panel.sliver || 0)) { n--; flags.push({ lvl: "warn", wall: w.code, t: `полоса ${Math.round(lastH)} мм у верха стены панелью не закрывается — перекрыть крышкой парапета / нащельником (или изменить высоту на ${Math.round(H - lastH)} мм)` }); }
  const rows = [];
  for (let i = 0; i < n; i++) rows.push([i * W, Math.min(Ht, (i + 1) * W)]);
  const nBelow = rows.filter((r) => r[0] < H - (P.panel.sliver || 0)).length;
  if (!rise && lastH >= (P.panel.sliver || 0) && lastH < W && lastH < 400) flags.push({ lvl: "warn", wall: w.code, t: `верхний ряд всего ${Math.round(lastH)} мм (панель ${W} распускается) — выгоднее изменить высоту на ${Math.round(H - lastH)} или ${Math.round(H - lastH + W)} мм либо выбрать другую ширину (вкладка «Спецификация» → «Подбор ширины»)` });
  const gableClip = (y) => {
    if (!rise || y < H - 1e-6) return [w.x0, w.x1];
    const f = Math.max(0, 1 - (y - H) / rise), Lw = w.x1 - w.x0;
    if (w.gable.type === "1") return [w.x1 - Lw * f, w.x1];
    const c = (w.x0 + w.x1) / 2; return [c - (Lw / 2) * f, c + (Lw / 2) * f];
  };
  const sup = supportsOf(w);
  const cols = uniqSort(w.columns && w.columns.length ? w.columns : sup);
  const gj = globalJoints(w.x0, w.x1, cols, P.panel.maxL, P.panel.minL);
  const pieces = [];
  rows.forEach(([y0, y1], ri) => {
    const color = w.kind === "part" ? P.panel.partColor
      : (P.panel.plinth && P.panel.plinthRows > 0 && y0 < P.panel.plinthRows * W - 1 ? P.panel.plinth
        : P.panel.band && P.panel.bandRows > 0 && ri >= nBelow - P.panel.bandRows && ri < nBelow ? P.panel.band : (w.color || P.panel.outer));
    const inner = w.kind === "part" ? P.panel.partColor : P.panel.inner;
    const ops = w.openings || [];
    const sl = P.panel.sliver || 0;
    const full = ops.filter((o) => o.y0 <= y0 + sl && o.y1 >= y1 - sl && o.y0 < y1 && o.y1 > y0 && (o.y1 - o.y0) > sl);
    const part = ops.filter((o) => o.y0 < y1 && o.y1 > y0 && !full.includes(o));
    const [ga, gb] = gableClip(y0), gTop = gableClip(y1);
    const segsRow = subIntervals(w.x0, w.x1, full.map((o) => [o.x0, o.x1])).map(([a, b]) => [Math.max(a, Math.floor(ga / 10) * 10), Math.min(b, Math.ceil(gb / 10) * 10)]).filter(([a, b]) => b - a >= 100);
    for (const [a, b] of segsRow) {
      let ps = [[a, b]];
      for (const p of gj) {
        const nw = [];
        for (const [c, d] of ps) { if (c + P.panel.minL <= p && p <= d - P.panel.minL) nw.push([c, p], [p, d]); else nw.push([c, d]); }
        ps = nw;
      }
      let changed = true, guard = 0;
      while (changed && guard++ < 50) {
        changed = false; const nw = [];
        for (const [c, d] of ps) {
          if (d - c > P.panel.maxL) {
            let cand = sup.filter((s) => s >= c + P.panel.minL && s <= Math.min(c + P.panel.maxL, d - P.panel.minL));
            if (!cand.length) cand = sup.filter((s) => s > c && s < d);
            if (!cand.length) { nw.push([c, d]); flags.push({ lvl: "err", wall: w.code, t: `ряд ${ri + 1}: участок ${d - c} мм длиннее ${P.panel.maxL} и без опор — нужна стойка` }); continue; }
            const s = cand.reduce((p, q) => (Math.min(q - c, d - q) > Math.min(p - c, d - p) ? q : p));
            nw.push([c, s], [s, d]); changed = true;
          } else nw.push([c, d]);
        }
        ps = nw;
      }
      for (const [c, d] of ps) {
        const cuts = [];
        for (const o of part) {
          if (o.x1 <= c || o.x0 >= d) continue;
          cuts.push({ x0: Math.max(o.x0, c), x1: Math.min(o.x1, d), y0: Math.max(o.y0, y0), y1: Math.min(o.y1, y1) });
        }
        const inside = sup.filter((s) => s >= c - 1 && s <= d + 1);
        const jl = c !== a, jr = d !== b;
        let L = d - c - (jl ? P.panel.gap / 2 : 0) - (jr ? P.panel.gap / 2 : 0);
        if (jl || jr) L = r10(L);
        let span = 0; for (let i = 1; i < inside.length; i++) span = Math.max(span, inside[i] - inside[i - 1]);
        const diag = rise && y1 > H + 1e-6 && (c < gTop[0] - 1 || d > gTop[1] + 1);
        pieces.push({ wall: w.code, kind: w.kind, row: ri, x0: c, x1: d, y0, y1, L, b: y1 - y0, color, inner, cuts, diag,
                      nsup: diag ? Math.max(2, inside.length) : inside.length, supports: inside, span, t: w.kind === "part" ? P.panel.partThickness : P.panel.thickness, W });
        if (inside.length < 2 && !diag) flags.push({ lvl: "err", wall: w.code, t: `ряд ${ri + 1}, x ${c}…${d}: панель опирается менее чем на 2 опоры — нужна стойка` });
      }
    }
  });
  return { rows, pieces };
}

/* --- вертикальная раскладка стены (Z-LOCK) --- */
function layoutVertical(w, P, flags) {
  const W = P.panel.width, H = w.height, pieces = [];
  const strips = [];
  for (let sx = w.x0; sx < w.x1 - 1; sx += W) strips.push([sx, Math.min(w.x1, sx + W)]);
  const rig = P.panel.rigelStep;
  const rise = w.gable && w.gable.rise > 0 ? w.gable.rise : 0, Lw = w.x1 - w.x0;
  const riseAt = (x) => !rise ? 0 : w.gable.type === "1" ? rise * (x - w.x0) / Lw : rise * Math.max(0, 1 - Math.abs(x - (w.x0 + w.x1) / 2) / (Lw / 2));
  strips.forEach(([sx, ex], si) => {
    const ops = w.openings || [];
    const sl = P.panel.sliver || 0;
    const full = ops.filter((o) => o.x0 <= sx + sl && o.x1 >= ex - sl && o.x0 < ex && o.x1 > sx && (o.x1 - o.x0) > sl);
    const part = ops.filter((o) => o.x0 < ex && o.x1 > sx && !full.includes(o));
    const c0 = (w.x0 + w.x1) / 2;
    const rTop = rise ? Math.max(riseAt(sx), riseAt(ex), w.gable.type !== "1" && sx < c0 && ex > c0 ? rise : 0) : 0;
    const Hs = H + Math.ceil(rTop / 10) * 10;
    for (const [a, b] of subIntervals(0, Hs, full.map((o) => [o.y0, o.y1]))) {
      let ps = [[a, b]], guard = 0;
      while (ps.some(([c, d]) => d - c > P.panel.maxL) && guard++ < 20) {
        ps = ps.flatMap(([c, d]) => {
          if (d - c <= P.panel.maxL) return [[c, d]];
          const mid = (c + d) / 2; const s = Math.round(mid / rig) * rig;
          return [[c, s], [s, d]];
        });
      }
      for (const [c, d] of ps) {
        const cuts = [];
        for (const o of part) {
          if (o.y1 <= c || o.y0 >= d) continue;
          cuts.push({ x0: Math.max(o.x0, sx), x1: Math.min(o.x1, ex), y0: Math.max(o.y0, c), y1: Math.min(o.y1, d) });
        }
        const nsup = Math.max(2, Math.floor((d - c) / rig) + 1);
        const color = w.kind === "part" ? P.panel.partColor : (w.color || P.panel.outer);
        const diag = rise > 0 && d > H + 1 && Math.abs(riseAt(sx) - riseAt(ex)) > 1;
        pieces.push({ wall: w.code, kind: w.kind, row: si, x0: sx, x1: ex, y0: c, y1: d, L: d - c, b: ex - sx, color, diag,
                      inner: w.kind === "part" ? P.panel.partColor : P.panel.inner, cuts, nsup, supports: [], span: rig,
                      t: w.kind === "part" ? P.panel.partThickness : P.panel.thickness, W, vertical: true });
      }
    }
  });
  return { rows: [[0, H]], pieces };
}

/* --- кровля --- */
function layoutRoof(R, P, flags) {
  const W = P.roof.width, pieces = [];
  const S = R.slopeLength + (P.roof.eave || 0), ov = P.roof.overlap, maxL = P.panel.maxL;
  const k = S <= maxL ? 1 : Math.ceil((S - ov) / (maxL - ov));
  const Ls = [];
  if (k === 1) Ls.push(S); else { const each = Math.ceil((S + (k - 1) * ov) / k / 10) * 10; for (let i = 0; i < k; i++) Ls.push(i < k - 1 ? each : S + (k - 1) * ov - each * (k - 1)); }
  if (R.slopeDeg != null) {
    const need = k > 1 ? 8 : 5;
    if (R.slopeDeg < need) flags.push({ lvl: "err", wall: "Кровля", t: `уклон ${R.slopeDeg}° меньше допустимого ${need}° (СП 362, минвата${k > 1 ? ", стык по скату" : ""}) — кровлю из ТСП делать нельзя` });
  }
  const nAcross = Math.ceil(R.length / W - 1e-9);
  for (let s = 0; s < (R.slopes || 1); s++) {
    for (let i = 0; i < nAcross; i++) {
      let y = 0;
      Ls.forEach((L, j) => {
        pieces.push({ wall: "К" + (s + 1), kind: "roof", row: j, x0: i * W, x1: Math.min(R.length, (i + 1) * W), y0: y, y1: y + L,
                      L, b: W, color: P.roof.outer, inner: P.roof.inner, cuts: [], nsup: Math.max(2, Math.floor(L / (R.purlinStep || 1500)) + 1),
                      supports: [], span: R.purlinStep || 1500, t: P.roof.thickness, W, slope: s });
        y += L - ov;
      });
    }
  }
  if (R.purlinStep > 3000) flags.push({ lvl: "warn", wall: "Кровля", t: `шаг прогонов ${R.purlinStep} мм больше 3 м — проверить по таблицам несущей способности и цвету` });
  return { pieces, k, Ls, nAcross, S };
}

function npcs(L, std, ov) { if (L <= 0) return 0; if (L <= std) return 1; return Math.ceil((L - ov) / (std - ov)); }

/* ============ главный расчёт ============ */
function compute(project, P) {
  const flags = [];
  const LOCKW = { "Z-LOCK": [1000, 1160, 1190], "SECRET FIX": [1000, 1095] };
  const okW = LOCKW[P.panel.lock] || [];
  if (okW.length && !okW.includes(Number(P.panel.width))) flags.push({ lvl: "warn", wall: "Панель", t: `ширина ${P.panel.width} мм нетипична для замка ${P.panel.lock} (обычно ${okW.join(" / ")} мм) — уточните у производителя` });
  if (P.panel.lock === "SECRET FIX" && P.panel.orient === "vertical") flags.push({ lvl: "err", wall: "Панель", t: "панели SECRET FIX монтируются только горизонтально — выберите Z-LOCK или горизонтальную раскладку" });
  if (P.panel.orient === "vertical" && ((P.panel.band && P.panel.bandRows > 0) || (P.panel.plinth && P.panel.plinthRows > 0))) flags.push({ lvl: "warn", wall: "Цвет", t: "при вертикальной раскладке цветные полосы по высоте не выполняются — цвет задаётся по стенам (поле «Цвет стены» в «Геометрии»)" });
  const walls = (project.walls || []).map((w) => ({ ...w, openings: (w.openings || []).map((o) => ({ ...o })) }));
  const out = { walls: [], roof: null, flags };
  for (const w of walls) {
    if (!(w.x1 > w.x0) || !(w.height > 0)) { flags.push({ lvl: "err", wall: w.code, t: "не заданы длина или высота стены" }); continue; }
    const res = P.panel.orient === "vertical" && w.kind !== "part" ? layoutVertical(w, P, flags) : layoutHorizontal(w, P, flags);
    const sup = supportsOf(w);
    const known = new Set([...(w.columns || []), ...(w.posts || []), ...(w.kind === "part" ? [w.x0, w.x1] : [])].map(Number));
    w.needPosts = sup.filter((s) => !known.has(s));
    if (w.needPosts.length && P.panel.orient !== "vertical")
      flags.push({ lvl: "warn", wall: w.code, t: `нет стоек у проёмов в точках x = ${w.needPosts.join(", ")} мм — выполнить стойки обрамления по расчёту` });
    const longSpan = res.pieces.filter((p) => p.span > P.panel.spanWarn);
    if (longSpan.length && P.panel.orient !== "vertical")
      flags.push({ lvl: "warn", wall: w.code, t: `${longSpan.length} панелей с пролётом между опорами > ${P.panel.spanWarn} мм (макс. ${Math.max(...longSpan.map((p) => p.span))}) — проверить расчётом или добавить стойку` });
    out.walls.push({ ...w, rows: res.rows, pieces: res.pieces, sup });
  }
  if (project.roof && project.roof.length > 0 && project.roof.slopeLength > 0) {
    const r = layoutRoof(project.roof, P, flags);
    out.roof = { ...project.roof, ...r, code: "К", title: "Кровля" };
  }
  const allPieces = [...out.walls.flatMap((w) => w.pieces), ...(out.roof ? out.roof.pieces : [])];

  /* марки */
  const marks = new Map();
  const groupOf = (p) => p.kind === "roof" ? "К" : p.wall;
  const counters = {};
  const sorted = [...allPieces].sort((a, b) => (groupOf(a) > groupOf(b) ? 1 : groupOf(a) < groupOf(b) ? -1 : a.row - b.row || a.x0 - b.x0));
  for (const p of sorted) {
    const rel = p.cuts.map((c) => [c.x0 - p.x0, c.x1 - p.x0, c.y0 - p.y0, c.y1 - p.y0].join(",")).sort().join(";");
    const key = [groupOf(p), p.kind, p.t, p.color, p.inner, p.L, p.b, rel, p.diag ? "d" : ""].join("|");
    if (!marks.has(key)) {
      const g = groupOf(p);
      counters[g] = (counters[g] || 0) + 1;
      const pre = p.kind === "roof" ? "К" : p.kind === "part" ? g : "С-" + g;
      marks.set(key, { mark: `${pre}-${String(counters[g]).padStart(2, "0")}`, kind: p.kind, wall: g, t: p.t, W: p.W, color: p.color, inner: p.inner,
                       L: p.L, b: p.b, cuts: p.cuts.map((c) => ({ x0: c.x0 - p.x0, x1: c.x1 - p.x0, y0: c.y0 - p.y0, y1: c.y1 - p.y0 })), vertical: !!p.vertical, diag: !!p.diag, n: 0, blanks: new Set() });
    }
    const m = marks.get(key); m.n++; p.mark = m.mark;
  }

  /* короткие → заготовки */
  const blanks = [];
  const short = allPieces.filter((p) => p.L < P.panel.minL);
  const gr = {};
  for (const p of short) { const k = [p.kind, p.t, p.color, p.inner].join("|"); (gr[k] = gr[k] || []).push(p); }
  for (const k of Object.keys(gr)) {
    const lst = gr[k].sort((a, b) => b.L - a.L), bins = [];
    for (const p of lst) {
      let placed = false;
      for (const b of bins) if (b.sum + p.L + 10 <= 6000 && b.sum < P.panel.minL) { b.items.push(p); b.sum += p.L + 10; placed = true; break; }
      if (!placed) bins.push({ items: [p], sum: p.L });
    }
    for (const b of bins) {
      const p0 = b.items[0];
      const name = `З-${String(blanks.length + 1).padStart(2, "0")}`;
      const Lb = Math.max(P.panel.minL, Math.ceil(b.sum / 10) * 10);
      b.items.forEach((p) => { p.blank = name; for (const m of marks.values()) if (m.mark === p.mark) m.blanks.add(name); });
      blanks.push({ name, kind: p0.kind, t: p0.t, W: p0.W, color: p0.color, inner: p0.inner, L: Lb,
                    items: b.items.map((p) => ({ mark: p.mark, L: p.L, b: p.b })), waste: Lb - b.sum });
    }
  }

  /* позиции заказа (одинаковые длины сводятся) */
  const order = new Map();
  for (const m of marks.values()) {
    if (m.L < P.panel.minL) continue;
    const kind = m.kind === "roof" ? "roof" : "wall";
    const key = [kind, m.t, m.W, m.color, m.inner, m.L].join("|");
    if (!order.has(key)) order.set(key, { kind, t: m.t, W: m.W, color: m.color, inner: m.inner, L: m.L, n: 0, marks: [], notes: [] });
    const o = order.get(key); o.n += m.n; o.marks.push(`${m.mark}×${m.n}`);
    if (m.b !== m.W) o.notes.push(`${m.mark}: распустить до ${m.b} мм`);
    if (m.cuts.length) o.notes.push(`${m.mark}: вырезы ${m.cuts.map((c) => `${c.x1 - c.x0}×${c.y1 - c.y0}`).join(", ")}`);
    if (m.diag) o.notes.push(`${m.mark}: срез по уклону фронтона по месту`);
  }
  for (const b of blanks) {
    const kind = b.kind === "roof" ? "roof" : "wall";
    const key = [kind, b.t, b.W, b.color, b.inner, b.L, "blank", b.name].join("|");
    order.set(key, { kind, t: b.t, W: b.W, color: b.color, inner: b.inner, L: b.L, n: 1, marks: [b.name], blank: true,
                     notes: [`разрезать: ${b.items.map((i) => `${i.mark} ${i.L}×${i.b}`).join(" + ")}`] });
  }
  const orderList = [...order.values()].sort((a, b) => (a.kind > b.kind ? 1 : a.kind < b.kind ? -1 : 0) || (a.color > b.color ? 1 : a.color < b.color ? -1 : 0) || b.L - a.L);
  orderList.forEach((o, i) => {
    o.pos = i + 1;
    o.desig = desig(P, o.kind, o.t, o.W, o.color, o.inner);
    o.area = (o.L * o.W) / 1e6 * o.n;
    o.kgm2 = kgm2(P, o.t, P.panel.core, o.kind === "roof");
    o.kg = o.area * o.kgm2;
  });

  /* ===== фасонные изделия ===== */
  const FI = new Map();
  const fi = (code, name, color, mat, razv, sketch, L, n = 1, std = 2000, ov = 0) => {
    if (L <= 0) return;
    const key = code + "|" + color;
    if (!FI.has(key)) FI.set(key, { code, name, color, mat, razv, sketch, std, len: 0, pcs: 0 });
    const f = FI.get(key); f.len += (L * n) / 1000; f.pcs += npcs(L, std, ov) * n;
  };
  const ext = out.walls.filter((w) => w.kind !== "part"), parts = out.walls.filter((w) => w.kind === "part");
  const OC = "RAL " + P.panel.outer, IC = "RAL " + P.panel.inner, BC = "RAL " + (P.panel.band || P.panel.outer);
  const CC = "RAL " + (P.panel.corner || P.panel.band || P.panel.outer);
  const ST = `сталь ${String(P.panel.metal).replace(".", ",")} мм ПЭ`, FU = "оцинк. сталь 2,0 мм";
  const jointsOf = (w) => {
    const byRow = {};
    for (const p of w.pieces) (byRow[p.row] = byRow[p.row] || []).push(p);
    const runs = [];
    for (const r of Object.keys(byRow)) {
      const lst = byRow[r].sort((a, b) => a.x0 - b.x0);
      for (let i = 1; i < lst.length; i++) if (lst[i].x0 === lst[i - 1].x1) runs.push({ x: lst[i].x0, y0: lst[i].y0, y1: lst[i].y1, color: lst[i].color });
    }
    return runs;
  };
  for (const w of ext) {
    const WC = "RAL " + (w.color || P.panel.outer), PL = "RAL " + (P.panel.plinth && P.panel.plinthRows > 0 && P.panel.orient !== "vertical" ? P.panel.plinth : (w.color || P.panel.outer));
    const holes = (w.openings || []).filter((o) => o.y0 <= 0).map((o) => [o.x0, o.x1]);
    for (const [a, b] of subIntervals(w.x0, w.x1, holes)) {
      fi("ФИУ-1", "Опорный элемент цоколя (уголок)", "оцинк.", FU, 230, "L 110×120", b - a, 1, 1250, 0);
      fi("ФИ-1", "Отлив цокольный", PL, ST, 200, "полка 130 + капельник 50 + подгиб 20", b - a, 1, 2000, 50);
    }
    if (P.panel.orient !== "vertical") {
      for (const j of jointsOf(w)) {
        fi("ФИ-3", "Нащельник вертикальный наружный (стык панелей)", "RAL " + j.color, ST, 170, "плоский 150 + подгибы 10", j.y1 - j.y0, 1, 2000, 100);
        fi("ФИ-11", "Нащельник вертикальный внутренний (стык панелей)", IC, ST, 120, "плоский 100 + подгибы 10", j.y1 - j.y0, 1, 2000, 100);
      }
    } else {
      const tiers = {};
      for (const p of w.pieces) if (p.y0 > 0 && !(w.openings || []).some((o) => Math.abs(o.y1 - p.y0) < 1)) tiers[p.y0] = (tiers[p.y0] || 0) + (p.x1 - p.x0);
      for (const y of Object.keys(tiers)) fi("ФИ-3Г", "Нащельник горизонтальный (стык ярусов, шов 20 мм)", WC, ST, 200, "Z-профиль 20/150 + подгибы", tiers[y], 1, 2000, 50);
    }
    for (const o of w.openings || []) {
      const ow = o.x1 - o.x0, oh = o.y1 - o.y0;
      fi("ФИ-5", "Откос проёма наружный", WC, ST, 210, "Г 130×60 + подгибы", oh, 2, 2000, 100);
      fi("ФИ-6", "Нащельник (козырёк) над проёмом", WC, ST, 220, "полка 130 + капельник 60", ow, 1, 2000, 50);
      fi("ФИ-12", "Обрамление проёма внутреннее", IC, ST, 160, "Г 100×50 + подгиб", oh, 2, 2000, 100);
      fi("ФИ-12", "Обрамление проёма внутреннее", IC, ST, 160, "Г 100×50 + подгиб", ow, isWin(o.type) ? 2 : 1, 2000, 50);
      if (isWin(o.type)) fi("ФИ-7", "Отлив оконный", WC, ST, 230, "полка 160 + капельник 50", ow, 1, 2000, 50);
      if (isDoor(o.type)) { fi("ФИУ-2", "Обрамление ворот/дверей (П-профиль)", "оцинк.", FU, 200, "П 50×100×50", oh, 2, 1250, 0); fi("ФИУ-2", "Обрамление ворот/дверей (П-профиль)", "оцинк.", FU, 200, "П 50×100×50", ow, 1, 1250, 0); }
    }
    const Lw = w.x1 - w.x0;
    if (out.roof) fi("ФИ-9", "Нащельник примыкания стены к кровле", BC, ST, 300, "Г 150×120 + подгибы", Lw, 1, 2000, 50);
    else fi("ФИ-8", "Крышка парапета", BC, ST, 360, "верх 120 + полки 80/140", Lw, 1, 2000, 50);
  }
  const Hmax = ext.length ? Math.max(...ext.map((w) => w.height)) : 0;
  const corners = project.corners ?? (ext.length >= 4 ? 4 : Math.max(0, ext.length - 1));
  if (corners && Hmax) {
    fi("ФИ-2", "Угол наружный", CC, ST, 420, "полки 200×200 + подгибы", Hmax, corners, 2000, 100);
    fi("ФИ-10", "Угол внутренний", IC, ST, 220, "полки 100×100 + подгибы", Hmax, corners, 2000, 100);
  }
  const PC = "RAL " + P.panel.partColor;

  for (const w of [A, Bw]) if (q.gatesN > 0 && has(q.gateWall, w.code)) {
    if (gW > st - 400) notes.push(`Ворота ${gW} мм шире пролёта ${Math.round(st)} мм минус стойки — проверьте размещение`);
    const bays = spread(Math.min(q.gatesN, nb), nb);
    for (const b of bays) { const c = (b + 0.5) * st; addOp(w, "Ворота", c - gW / 2, c + gW / 2, 0, gH, `Ворота ${gW}×${gH}`); used[w.code].add(b); }
  }
  for (const w of [E1, E2]) if (q.gatesN > 0 && has(q.gateWall, w.code)) {
    const n = Math.min(q.gatesN, 2);
    for (let i = 0; i < n; i++) { const c = ((i + 0.5) * B) / n; addOp(w, "Ворота", c - gW / 2, c + gW / 2, 0, gH, `Ворота ${gW}×${gH}`); }
    w.posts = w.posts.filter((p) => !w.openings.some((o) => p > o.x0 + 1 && p < o.x1 - 1));
  }
  // двери
  let dleft = q.doorsN;
  for (const w of [A, Bw, E1, E2]) {
    if (dleft <= 0 || !has(q.doorWall, w.code)) continue;
    if (w === A || w === Bw) {
      for (let b = 0; b < nb && dleft > 0; b++) {
        if (used[w.code].has(b)) continue;
        const x0 = b * st + 700; addOp(w, "Дверь", x0, x0 + q.doorW, 0, q.doorH, `Дверь ${q.doorW}×${q.doorH}`); used[w.code].add(b); dleft--;
      }
    } else {
      const c = B - 700 - q.doorW; addOp(w, "Дверь", c, c + q.doorW, 0, q.doorH, `Дверь ${q.doorW}×${q.doorH}`); dleft--;
    }
  }
  // окна
  for (const w of [A, Bw]) if (q.winN > 0 && has(q.winWall, w.code)) {
    const free = []; for (let b = 0; b < nb; b++) if (!used[w.code].has(b)) free.push(b);
    const pick = spread(Math.min(q.winN, free.length), free.length).map((i) => free[i]);
    for (const b of pick) { const c = (b + 0.5) * st; addOp(w, "Окно", c - q.winW / 2, c + q.winW / 2, q.winSill, q.winSill + q.winH, `Окно ${q.winW}×${q.winH}`); }
    if (q.winN > free.length) notes.push(`Фасад ${w.code}: окон ${q.winN}, свободных пролётов ${free.length} — поставлено ${pick.length}`);
  }
  for (const w of [A, Bw, E1, E2]) { w.posts = uniqSort(w.posts.filter((p) => !w.columns.includes(p))); w.openings.sort((a, b) => a.x0 - b.x0); }
  const roof = roofType === "none" ? null : {
    length: L + 2 * off, slopes: roofType === "2" ? 2 : 1, slopeDeg: q.roofDeg, purlinStep: q.purlin,
    slopeLength: Math.round((roofType === "2" ? B / 2 + off : B + 2 * off) / Math.cos(rad)) };
  notes.push("Быстрый ввод: прямоугольное здание; обрамление ворот, дверей и окон принято предусмотренным в каркасе.");
  if (rise) notes.push(`Фронтоны торцов: подъём ${rise} мм, панели режутся по уклону по месту.`);
  return { walls: [A, Bw, E1, E2], roof, corners: 4, notes };
}

/* ===== Подбор ширины: расчёт по всем типовым ширинам замка ===== */
function compareWidths(project, P0) {
  const LOCKW = { "Z-LOCK": [1000, 1160, 1190], "SECRET FIX": [1000, 1095] };
  const ws = LOCKW[P0.panel.lock] || [1000, 1095, 1160, 1190];
  return ws.map((W) => {
    const P = clone(P0); P.panel.width = W;
    try {
      const r = compute(project, P), t = r.totals;
      return { W, pcs: t.orderPcs, area: t.orderArea, waste: t.waste, wastePct: t.orderArea ? (t.waste / t.orderArea) * 100 : 0, marks: t.marks, packs: t.packs, trucks: t.trucks, kg: t.shipKg, screws: r.fx.filter((x) => /сэндвич/.test(x.name)).reduce((s, x) => s + x.qtyRes, 0) };
    } catch (e) { return { W, err: true }; }
  });
}

async function addFiles(files) {
  for (const f of files) {
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      if (!window.pdfjsLib) { toast("Библиотека PDF не загрузилась — загрузите листы картинками"); continue; }
      try {
        const buf = await f.arrayBuffer();
        const doc = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const vp = page.getViewport({ scale: 1 });
          const sc = 260 / Math.max(vp.width, vp.height);
          const c = document.createElement("canvas"); const v = page.getViewport({ scale: sc });
          c.width = v.width; c.height = v.height;
          await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
          let text = "";
          try { const tc = await page.getTextContent(); text = tc.items.map((it) => it.str).join(" ").replace(/\s+/g, " ").trim(); } catch (e) {}
          const hint = /фасад/i.test(text) ? "фасад" : /развертк|развёртк/i.test(text) ? "развертка" : /план\s+каркас|план\s+на\s+отм|план\s+кровли/i.test(text) ? "план" : /разрез/i.test(text) ? "разрез" : "";
          S.pages.push({ name: f.name, page: i, doc, thumb: c.toDataURL("image/jpeg", 0.7), text, hint, checked: !!hint && !/кровли/i.test(hint) });
          if (S.tab === "project" && i % 4 === 0) renderTab();
        }
      } catch (e) { console.error(e); toast("Не удалось открыть " + f.name); }
    } else if (/^image\//.test(f.type)) {
      S.pages.push({ name: f.name, page: 1, file: f, thumb: URL.createObjectURL(f), text: "", hint: "", checked: true });
    }
  }
  if (!S.pages.some((p) => p.checked)) S.pages.forEach((p) => (p.checked = true));
  renderTab();
}
async function pageBlob(p) {
  if (p.file) return p.file;
  const page = await p.doc.getPage(p.page);
  const vp = page.getViewport({ scale: 1 });
  const sc = 2000 / Math.max(vp.width, vp.height);
  const v = page.getViewport({ scale: sc });
  const c = document.createElement("canvas"); c.width = v.width; c.height = v.height;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: v }).promise;
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
}

const RECOG_PROMPT = `Ты — инженер по ограждающим конструкциям из трёхслойных сэндвич-панелей на металлокаркасе. На изображениях — листы проекта (АР/КР): фасады, планы, разрезы, развертки каркаса по осям. Ниже дан текстовый слой PDF этих листов (размеры, отметки, подписи).
Задача: извлечь геометрию для раскладки сэндвич-панелей — все наружные стены и внутренние перегородки ИЗ СЭНДВИЧ-ПАНЕЛЕЙ (не из блоков, кирпича, ГКЛ), и кровлю, если она из сэндвич-панелей.

Система координат (всё в мм, целые числа):
- Каждая стена — в своём виде, как на фасаде/развертке; наружные стены — вид снаружи здания.
- x — вдоль стены слева направо по виду. x=0 — первая (левая) ось на этом виде. x0, x1 — левая и правая границы обшивки (наружные грани); для наружных стен они обычно выходят за крайние оси на привязку, например x0=-300, x1=L+300.
- y — вверх от низа панелей. base — отметка низа панелей в мм (обычно 0). height — высота обшивки от низа до верха (верх парапета или карниза).
- axes — оси на виде: [{"x":0,"name":"1"},...]. columns — x всех колонн каркаса на этой стене. posts — x стоек фахверка и стоек обрамления проёмов, если они показаны в КР.
- openings — все проёмы: {"type":"Ворота"|"Дверь"|"Окно"|"Витраж","x0","x1","y0","y1","label"}; y — от низа панелей; ленточное остекление — один проём.
- kind: "ext" — наружная стена, "part" — перегородка из сэндвич-панелей.
- code — короткий код: фасад по оси А → "А", по оси 1 → "1"; перегородка — "П" + ось или номер ("П2"). title — понятное название.
Кровля: roof = {"length": длина вдоль здания, "slopeLength": длина ската по уклону от наружной грани стены до конька, "slopes": 1 или 2, "slopeDeg": уклон в градусах, "purlinStep": шаг прогонов} — только если кровля из сэндвич-панелей, иначе null.
Если развертки нет, вычисли привязки проёмов по плану и фасаду. Не выдумывай: если размер не читается, оцени по масштабу и запиши в notes, что оценено. Расхождения между листами — тоже в notes (коротко).
Если указано, извлеки panel: {"thickness","width","core":"МВ"|"ППС"|"PIR","outer":"RAL без слова RAL","inner","orient":"horizontal"|"vertical"}.
Ответь ТОЛЬКО одним JSON:
{"object":"название объекта / шифр","panel":{},"walls":[{"code":"А","title":"Фасад по оси А (1–7)","kind":"ext","base":0,"x0":-300,"x1":36300,"height":9000,"axes":[{"x":0,"name":"1"},{"x":6000,"name":"2"}],"columns":[0,6000],"posts":[],"openings":[{"type":"Ворота","x0":7000,"x1":11000,"y0":0,"y1":4400,"label":"Ворота 4000×4400"}]}],"roof":null,"notes":["..."]}`;

let recCtl = null;
async function recognize() {
  const sample = await cap("sample");
  if (!sample) { setStatus("Распознавание недоступно в этом просмотре. Откройте страницу в Claude или введите геометрию вручную на вкладке «Геометрия».", "err"); return; }
  const lim = await sample.limits().catch(() => null);
  const maxN = Math.min(6, lim?.images?.maxCount || 0);
  if (!maxN) { setStatus("Этот просмотр не может отправлять изображения в Claude. Введите геометрию вручную на вкладке «Геометрия».", "err"); return; }
  const pages = S.pages.filter((p) => p.checked);
  const batches = []; for (let i = 0; i < pages.length; i += maxN) batches.push(pages.slice(i, i + maxN));
  S.busy = true; recCtl = new AbortController(); renderTab();
  const merge = $("#recMerge") ? $("#recMerge").checked : true; S.merge = merge;
  let found = merge ? clone(PRJ.walls) : [], roof = merge ? PRJ.roof : null, notes = merge ? [...(PRJ.notes || [])] : [], obj = "", panel = {};
  try {
    for (let bi = 0; bi < batches.length; bi++) {
      const b = batches[bi];
      setStatus(`Пакет ${bi + 1} из ${batches.length}: готовлю ${b.length} лист(ов)…`);
      const imgs = [];
      for (const p of b) imgs.push(await pageBlob(p));
      const text = b.map((p, i) => `--- Изображение ${i + 1}: ${p.name}, лист ${p.page} ---\n${(p.text || "(текстового слоя нет)").slice(0, 6000)}`).join("\n\n");
      const known = found.length ? `\nУже найдены стены (коды): ${found.map((w) => w.code).join(", ")}. Если на этих листах есть та же стена с более полными данными — верни её снова с тем же code; новые стены добавь.\n` : "";
      setStatus(`Пакет ${bi + 1} из ${batches.length}: Claude читает чертежи… (обычно 1–3 минуты)`);
      let chars = 0;
      const data = await sample.json(RECOG_PROMPT + known + "\n\nТЕКСТОВЫЙ СЛОЙ:\n" + text, {
        images: imgs, modelTier: "complex", signal: recCtl.signal,
        onText: ({ text }) => { if (text.length - chars > 400) { chars = text.length; setStatus(`Пакет ${bi + 1} из ${batches.length}: получено ${fmt(text.length)} символов ответа…`); } },
      });
      if (data && Array.isArray(data.walls)) {
        for (const w of data.walls) {
          const nw = normWall(w);
          const i = found.findIndex((x) => x.code === nw.code);
          if (i < 0) found.push(nw);
          else if ((nw.openings.length + nw.columns.length + nw.posts.length) >= (found[i].openings.length + found[i].columns.length + found[i].posts.length)) found[i] = nw;
        }
      }
      if (data && data.roof && data.roof.length) roof = { length: num(data.roof.length), slopeLength: num(data.roof.slopeLength), slopes: num(data.roof.slopes) || 1, slopeDeg: data.roof.slopeDeg != null ? num(data.roof.slopeDeg) : null, purlinStep: num(data.roof.purlinStep) || 1500 };
      if (data && Array.isArray(data.notes)) notes.push(...data.notes.map(String));
      if (data && data.object) obj = String(data.object);
      if (data && data.panel && typeof data.panel === "object") Object.assign(panel, data.panel);
    }
    PRJ.walls = found; PRJ.roof = roof; PRJ.notes = [...new Set(notes)];
    if (obj && (!PRJ.name || /^Пример|^Новый/.test(PRJ.name))) PRJ.name = obj;
    applyPanelHints(panel);
    S.sel = 0; S.busy = false;
    setStatus(`Готово: стен ${found.length}${roof ? ", кровля из ТСП" : ""}. Проверьте размеры на вкладке «Геометрия».`, "ok");
    recalc();
  } catch (e) {
    S.busy = false;
    const msg = { cancelled: "Остановлено.", not_granted: "Доступ к Claude не разрешён для этой страницы.", rate_limited: "Слишком много запросов или исчерпан лимит — попробуйте позже.", invalid_json: "Ответ не удалось разобрать. Попробуйте ещё раз или выберите меньше листов.", image_rejected: "Один из листов не принят — попробуйте другой файл.", prompt_too_large: "Слишком много текста — выберите меньше листов." }[e && e.code] || "Ошибка распознавания: " + (e && (e.message || e.code) || e);
    if (found.length && found !== PRJ.walls && merge === false) {}
    setStatus(msg, e && e.code === "cancelled" ? "" : "err");
    renderTab();
  }
}
function applyPanelHints(p) {
  if (!p) return;
  if (p.thickness) P.panel.thickness = num(p.thickness);
  if (p.width) P.panel.width = num(p.width);
  if (p.core && /МВ|ППС|PIR/.test(p.core)) P.panel.core = p.core;
  if (p.outer) P.panel.outer = String(p.outer).replace(/\D/g, "") || P.panel.outer;
  if (p.inner) P.panel.inner = String(p.inner).replace(/\D/g, "") || P.panel.inner;
  if (p.orient === "vertical" || p.orient === "horizontal") P.panel.orient = p.orient;
}
function normWall(w) {
  const o = (w.openings || []).map((x) => ({ type: String(x.type || "Окно"), x0: num(x.x0), x1: num(x.x1), y0: num(x.y0), y1: num(x.y1), label: String(x.label || "") })).filter((x) => x.x1 > x.x0 && x.y1 > x.y0);
  return { code: String(w.code || "?"), title: String(w.title || "Стена " + (w.code || "")), kind: w.kind === "part" ? "part" : "ext", base: num(w.base), x0: num(w.x0), x1: num(w.x1), height: num(w.height),
           axes: (w.axes || []).map((a) => ({ x: num(a.x), name: String(a.name) })), columns: (w.columns || []).map(num), posts: (w.posts || []).map(num), openings: o };
}
function setStatus(t, cls) { S.status = t; S.statusCls = cls || ""; const el = $("#recStatus"); if (el) el.innerHTML = `<div class="status ${cls || ""}">${esc(t)}</div>`; }

  }

  }));

    if (!PRJ.name || /^Пример|^Новый|^Здание /.test(PRJ.name)) PRJ.name = `Здание ${q.L}×${q.B}×${q.H} м`;

  b("#selNone", () => { S.pages.forEach((p) => (p.checked = false)); renderTab(); });

/* =================== SVG: стена =================== */
function legendHTML() {
  return `<div class="legend" style="margin-top:8px"><span><i style="border-color:var(--col);border-top-style:dashed"></i>колонна</span><span><i style="border-color:var(--ok);border-top-style:dotted"></i>стойка фахверка / обрамления</span><span><i style="border-color:var(--post-need);border-top-width:3px;border-top-style:dashed"></i>стойки нет в каркасе — нужна</span><span><i style="border-color:var(--err)"></i>вырез в панели</span><span><i style="border-color:var(--open)"></i>проём</span></div>`;
}
function wallSVG(w, opts = {}) {
  const rise = w.gable && w.gable.rise > 0 ? w.gable.rise : 0;
  const x0 = w.x0, x1 = w.x1, H = w.height + rise, Hw = w.height, L = x1 - x0;
  const k = L / 1100;
  const fs = Math.max(120, Math.min(260, k * 11));
  const mL = fs * 5.5, mR = fs * 2.5, mT = fs * 1.6, mB = fs * 9;
  const vb = [x0 - mL, -H - mT, L + mL + mR, H + mT + mB];
  const Y = (y) => -y;
  const BG = opts.print ? "#fff" : "var(--surface)";
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(" ")}" font-family="IBM Plex Sans, Arial, sans-serif" role="img" aria-label="Раскладка ${esc(w.title)}" style="color:${opts.print ? "#1C2126" : "var(--ink)"}">`;
  s += `<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:${opts.print ? "#fff" : "var(--surface)"}"/>`;
  for (const p of w.pieces) {
    const hex = ralHex(p.color), tc = lum(hex) > 0.55 ? "#1C2126" : "#FFFFFF";
    s += `<rect x="${p.x0}" y="${Y(p.y1)}" width="${p.x1 - p.x0}" height="${p.y1 - p.y0}" fill="${hex}" fill-opacity="0.82" stroke="#1C2126" stroke-width="${fs * 0.1}"/>`;
    for (const c of p.cuts) s += `<rect x="${c.x0}" y="${Y(c.y1)}" width="${c.x1 - c.x0}" height="${c.y1 - c.y0}" fill="#fff" stroke="#B3261E" stroke-width="${fs * 0.12}"/><path d="M${c.x0} ${Y(c.y0)}L${c.x1} ${Y(c.y1)}" stroke="#B3261E" stroke-width="${fs * 0.06}"/>`;
    const pw = p.x1 - p.x0, ph = p.y1 - p.y0, cx = (p.x0 + p.x1) / 2, cy = Y(p.y0 + ph * (p.cuts.length ? 0.68 : 0.5));
    const f = Math.min(fs, ph * 0.34, pw * 0.16);
    if (p.vertical) {
      if (pw > fs * 2.2 && ph > fs * 6) s += `<text x="${cx}" y="${cy}" font-size="${Math.min(fs, pw * 0.22)}" fill="${tc}" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 ${cx} ${cy})">${esc(p.mark)} · ${p.L}</text>`;
    } else if (pw > fs * 11) s += `<text x="${cx}" y="${cy}" font-size="${f}" fill="${tc}" text-anchor="middle" dominant-baseline="middle">${esc(p.mark)}  L=${p.L}</text>`;
    else if (pw > fs * 4.2) s += `<text x="${cx}" y="${cy - f * 0.35}" font-size="${f * 0.9}" fill="${tc}" text-anchor="middle" dominant-baseline="middle">${esc(p.mark)}</text><text x="${cx}" y="${cy + f * 0.75}" font-size="${f * 0.8}" fill="${tc}" text-anchor="middle" dominant-baseline="middle">${p.L}</text>`;
    else if (pw > fs * 1.4) s += `<text x="${cx}" y="${cy}" font-size="${Math.min(f, pw * 0.3)}" fill="${tc}" text-anchor="middle" dominant-baseline="middle">${esc(p.mark.split("-").pop())}</text>`;
  }
  for (const o of w.openings || []) {
    s += `<rect x="${o.x0}" y="${Y(o.y1)}" width="${o.x1 - o.x0}" height="${o.y1 - o.y0}" style="fill:${opts.print ? "#fff" : "var(--surface)"}" stroke="#2B5C9E" stroke-width="${fs * 0.12}"/>`;
    s += `<path d="M${o.x0} ${Y(o.y0)}L${o.x1} ${Y(o.y1)}M${o.x0} ${Y(o.y1)}L${o.x1} ${Y(o.y0)}" stroke="#2B5C9E" stroke-width="${fs * 0.04}"/>`;
    if (o.x1 - o.x0 > fs * 9 && o.y1 - o.y0 > fs * 1.2) s += `<text x="${(o.x0 + o.x1) / 2}" y="${Y((o.y0 + o.y1) / 2)}" font-size="${fs * 0.75}" fill="#2B5C9E" text-anchor="middle" dominant-baseline="middle">${esc(o.label || o.type)}</text>`;
  }
  const line = (x, col, dash, sw) => `<path d="M${x} ${Y(-fs * 0.6)}L${x} ${Y(H + fs * 0.6)}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${dash}" fill="none"/>`;
  for (const c of w.columns || []) s += line(c, "#26508F", `${fs * 1.2} ${fs * 0.4} ${fs * 0.2} ${fs * 0.4}`, fs * 0.12);
  for (const c of w.posts || []) if (!(w.columns || []).includes(c)) s += line(c, "#2E7A4E", `${fs * 0.3} ${fs * 0.3}`, fs * 0.12);
  for (const c of w.needPosts || []) s += line(c, "#E07B00", `${fs * 0.6} ${fs * 0.3}`, fs * 0.22);
  if (rise) {
    const top = w.gable.type === "1" ? `L${x1} ${Y(H)}L${x0} ${Y(Hw)}` : `L${(x0 + x1) / 2} ${Y(H)}L${x0} ${Y(Hw)}`;
    const cut = w.gable.type === "1" ? `M${x0} ${Y(Hw)}L${x1} ${Y(H)}L${x0} ${Y(H)}Z` : `M${x0} ${Y(Hw)}L${(x0 + x1) / 2} ${Y(H)}L${x0} ${Y(H)}ZM${x1} ${Y(Hw)}L${(x0 + x1) / 2} ${Y(H)}L${x1} ${Y(H)}Z`;
    s += `<path d="${cut}" style="fill:${BG}" fill-opacity="0.78"/>`;
    s += `<path d="M${x0} ${Y(0)}L${x1} ${Y(0)}L${x1} ${Y(Hw)}${top}Z" fill="none" stroke="currentColor" stroke-width="${fs * 0.22}"/>`;
  } else s += `<rect x="${x0}" y="${Y(H)}" width="${L}" height="${H}" fill="none" stroke="currentColor" stroke-width="${fs * 0.22}"/>`;
  // отметки
  const lv = uniqSort([0, Hw, H, ...w.rows.map((r) => r[0])]);
  const lvT = lv.length > 14 ? [0, H] : lv;
  for (const y of lvT) {
    const t = (w.base + y) / 1000; const lab = (t === 0 ? "±" : t > 0 ? "+" : "") + t.toFixed(3).replace(".", ",");
    s += `<path d="M${x0 - fs * 4.8} ${Y(y)}L${x0 - fs * 0.3} ${Y(y)}" stroke="currentColor" stroke-opacity="0.55" stroke-width="${fs * 0.05}"/><text x="${x0 - fs * 4.8}" y="${Y(y) - fs * 0.15}" font-size="${fs * 0.7}" fill="currentColor" fill-opacity="0.75">${lab}</text>`;
  }
  // размерные цепочки
  const chain = (pts, yy, small) => {
    pts = uniqSort(pts.filter((p) => p >= x0 - 1 && p <= x1 + 1));
    let t = `<path d="M${pts[0]} ${yy}L${pts[pts.length - 1]} ${yy}" stroke="currentColor" stroke-opacity="0.55" stroke-width="${fs * 0.05}"/>`;
    for (const p of pts) t += `<path d="M${p - fs * 0.25} ${yy + fs * 0.25}L${p + fs * 0.25} ${yy - fs * 0.25}" stroke="currentColor" stroke-width="${fs * 0.09}"/>`;
    for (let i = 1; i < pts.length; i++) { const d = pts[i] - pts[i - 1]; if (d > fs * (small ? 2.3 : 3)) t += `<text x="${(pts[i] + pts[i - 1]) / 2}" y="${yy - fs * 0.2}" font-size="${fs * (small ? 0.62 : 0.72)}" fill="currentColor" text-anchor="middle">${d}</text>`; }
    return t;
  };
  const op = [x0, x1]; for (const o of w.openings || []) op.push(o.x0, o.x1); for (const c of w.needPosts || []) op.push(c);
  s += chain(op, fs * 1.3, true);
  const ax = (w.axes || []).map((a) => a.x);
  if (ax.length) s += chain([x0, ...ax, x1], fs * 3.1);
  s += chain([x0, x1], fs * 4.9);
  for (const a of w.axes || []) s += `<path d="M${a.x} ${fs * 5.2}L${a.x} ${fs * 6.2}" stroke="currentColor" stroke-opacity="0.55" stroke-width="${fs * 0.05}"/><circle cx="${a.x}" cy="${fs * 7}" r="${fs * 0.8}" style="fill:${BG}" stroke="currentColor" stroke-width="${fs * 0.07}"/><text x="${a.x}" y="${fs * 7}" font-size="${fs * 0.85}" text-anchor="middle" dominant-baseline="central" fill="currentColor">${esc(a.name)}</text>`;
  return s + `</svg>`;
}
function roofSVG(r, opts = {}) {
  const ns = r.slopes || 1, gap = 1500, S = r.S, L = r.length;
  const fs = Math.max(120, Math.min(260, L / 100));
  const Wt = L, Ht = S * ns + gap * (ns - 1);
  const vb = [-fs * 3, -fs * 2, Wt + fs * 6, Ht + fs * 5];
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(" ")}" font-family="IBM Plex Sans, Arial, sans-serif" style="color:${opts.print ? "#1C2126" : "var(--ink)"}">`;
  s += `<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:${opts.print ? "#fff" : "var(--surface)"}"/>`;
  for (let sl = 0; sl < ns; sl++) {
    const oy = sl * (S + gap);
    s += `<text x="0" y="${oy - fs * 0.5}" font-size="${fs}" fill="currentColor">Скат ${sl + 1}: ${r.nAcross} панелей × ${r.k} по длине ската, L = ${r.Ls.join(" / ")} мм${r.k > 1 ? `, нахлёст ${P.roof.overlap}` : ""}</text>`;
    for (const p of r.pieces.filter((q) => q.slope === sl)) {
      const hex = ralHex(p.color), tc = lum(hex) > 0.55 ? "#1C2126" : "#fff";
      s += `<rect x="${p.x0}" y="${oy + p.y0}" width="${p.x1 - p.x0}" height="${p.L}" fill="${hex}" fill-opacity="0.75" stroke="#1C2126" stroke-width="${fs * 0.08}"/>`;
      if (p.x1 - p.x0 > fs * 1.2 && p.x0 % (1000 * Math.max(1, Math.ceil(fs * 5 / 1000))) < 1) s += `<text x="${(p.x0 + p.x1) / 2}" y="${oy + p.y0 + p.L / 2}" font-size="${fs * 0.7}" fill="${tc}" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 ${(p.x0 + p.x1) / 2} ${oy + p.y0 + p.L / 2})">${esc(p.mark)}</text>`;
    }
  }
  return s + `</svg>`;
}

/* =================== РАСКЛАДКА =================== */
function marksTable(code) {
  const ms = R.marks.filter((m) => m.wall === code || (code === "К" && m.kind === "roof"));
  return `<div class="tbl-wrap"><table><thead><tr><th>Марка</th><th class="n">Длина</th><th class="n">Ширина в деле</th><th class="n">Кол-во</th><th>Цвет</th><th>Примечание</th></tr></thead><tbody>${ms.map((m) => {
    const notes = [];
    if (m.b !== m.W) notes.push(`распустить до ${m.b} мм`);
    if (m.cuts.length) notes.push(m.cuts.map((c) => `вырез ${c.x1 - c.x0}×${c.y1 - c.y0}`).join(", "));
    if (m.blanks.size) notes.push("нарезать из " + [...m.blanks].join(", "));
    if (m.diag) notes.push("срез по уклону фронтона по месту");
    return `<tr><td class="mono">${esc(m.mark)}</td><td class="n">${m.L}</td><td class="n">${m.b}</td><td class="n">${m.n}</td><td><span class="sw" style="background:${ralHex(m.color)}"></span>${m.color}/${m.inner}</td><td class="small">${esc(notes.join("; "))}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
function tabLayout() {
  if (!R || (!R.walls.length && !R.roof)) return `<div class="card empty">Нет геометрии. Загрузите проект или откройте пример.</div>`;
  const cols = R.totals.byColor;
  return `<div class="card"><div class="row small" style="gap:14px"><b>Цвета:</b>${cols.map((c) => `<span><span class="sw" style="background:${ralHex(c.color)}"></span>RAL ${c.color}${RAL_NAMES[c.color] ? " " + RAL_NAMES[c.color] : ""} / ${c.inner} — <span class="mono">${fmt(c.area, 1)} м²</span>, ${c.n} шт.</span>`).join("")}</div></div>` + R.walls.map((w) => `
    <div class="card">
      <div class="ptitle"><h2 style="margin:0">${esc(w.code)} — ${esc(w.title)}</h2><span class="muted small mono">${fmt(w.x1 - w.x0)} × ${fmt(w.height)} мм · ${w.pieces.length} панелей · ${new Set(w.pieces.map((p) => p.mark)).size} марок</span></div>
      <div class="svgbox" style="margin-top:10px">${wallSVG(w)}</div>
      <details><summary>Марки панелей (${new Set(w.pieces.map((p) => p.mark)).size})</summary><div style="margin-top:8px">${marksTable(w.code)}</div></details>
    </div>`).join("") + (R.roof ? `<div class="card"><h2>Кровля</h2><div class="svgbox">${roofSVG(R.roof)}</div><details><summary>Марки кровельных панелей</summary><div style="margin-top:8px">${marksTable("К")}</div></details></div>` : "") + `<div class="card">${legendHTML()}</div>`;
}

/* =================== ПОДБОР ШИРИНЫ =================== */
function widthCmpHTML() {
  if (!PRJ.walls.length) return "";
  const rows = compareWidths(PRJ, P).filter((x) => !x.err);
  if (rows.length < 2) return "";
  const best = (k) => Math.min(...rows.map((x) => x[k]));
  const c = (x, k, d = 0, suf = "") => `<td class="n ${x[k] === best(k) ? "best" : ""}">${fmt(x[k], d)}${suf}</td>`;
  return `<div class="subh">Подбор ширины панели (${esc(P.panel.lock)}, ${P.panel.thickness} мм)</div>
  <div class="tbl-wrap wcmp"><table><thead><tr><th class="n">Ширина</th><th class="n">Панелей, шт.</th><th class="n">Заказ, м²</th><th class="n">Отход</th><th class="n">Марок</th><th class="n">Пачек</th><th class="n">Машин</th><th class="n">Саморезов</th><th></th></tr></thead><tbody>
  ${rows.map((x) => `<tr><td class="n"><b>${x.W}</b></td>${c(x, "pcs")}${c(x, "area", 1)}${c(x, "wastePct", 1, " %")}${c(x, "marks")}${c(x, "packs")}${c(x, "trucks")}${c(x, "screws")}<td>${+P.panel.width === x.W ? `<span class="chip ext">выбрана</span>` : `<button type="button" class="small" data-setw="${x.W}">Выбрать</button>`}</td></tr>`).join("")}
  </tbody></table></div><p class="hint">Зелёным — лучшее значение в столбце. Меньше отход — меньше переплата за металл; меньше панелей и марок — быстрее монтаж.</p>`;
}
function bindWidthCmp() { $("#main").querySelectorAll("[data-setw]").forEach((b) => (b.onclick = () => { P.panel.width = +b.dataset.setw; recalc(); toast("Ширина панели: " + b.dataset.setw + " мм"); })); }

/* =================== СПЕЦИФИКАЦИЯ =================== */

  if (!R || !R.order.length) return `<div class="card empty">Нет данных</div>`;
  const t = R.totals;
  return `
  <div class="card">${widthCmpHTML()}</div>
  <div class="card">
    <h2>Панели к заказу</h2>
    <div class="row small" style="margin-bottom:10px;gap:14px">${t.byColor.map((c) => `<span><span class="sw" style="background:${ralHex(c.color)}"></span>${c.kind === "roof" ? "кровля" : "стены"} ${c.color}/${c.inner}: <b class="mono">${fmt(c.area, 1)} м²</b>, ${c.n} шт.</span>`).join("")}</div>
    <div class="tbl-wrap"><table><thead><tr><th class="n">Поз.</th><th>Обозначение</th><th class="n">Длина, мм</th><th class="n">Кол-во</th><th class="n">Площадь, м²</th><th class="n">Масса, кг</th><th>Марки</th><th>Примечание</th></tr></thead><tbody>
      ${R.order.map((o) => `<tr><td class="n">${o.pos}</td><td class="small">${esc(o.desig)}</td><td class="n">${o.L}</td><td class="n">${o.n}</td><td class="n">${fmt(o.area, 2)}</td><td class="n">${fmt(o.kg)}</td><td class="small mono">${esc(o.marks.join(", "))}</td><td class="small">${esc(o.notes.join("; "))}</td></tr>`).join("")}
    </tbody><tfoot><tr><td></td><td>Итого</td><td></td><td class="n">${fmt(t.orderPcs)}</td><td class="n">${fmt(t.orderArea, 2)}</td><td class="n">${fmt(t.orderKg)}</td><td colspan="2" class="small">нетто в деле ${fmt(t.netArea, 2)} м², отход ${fmt(t.waste, 2)} м²</td></tr></tfoot></table></div>
  </div>
  <div class="card"><h2>Фасонные изделия</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Марка</th><th>Наименование</th><th>Сечение</th><th class="n">Развёртка</th><th>Материал / цвет</th><th class="n">Длина изд.</th><th class="n">П.м узлов</th><th class="n">Шт.</th><th class="n">С запасом</th></tr></thead><tbody>
    ${R.fi.map((f) => `<tr><td class="mono">${f.code}</td><td>${esc(f.name)}</td><td class="small">${esc(f.sketch)}</td><td class="n">${f.razv}</td><td class="small">${esc(f.mat)}, ${esc(f.color)}</td><td class="n">${f.std}</td><td class="n">${fmt(f.len, 1)}</td><td class="n">${f.pcs}</td><td class="n">${f.pcsRes}</td></tr>`).join("")}
    </tbody></table></div><p class="hint">Кол-во = ⌈(L узла − нахлёст)/(L изделия − нахлёст)⌉; нахлёст горизонтальных 50 мм, вертикальных 100 мм; ФИУ — встык. Сечения уточнить по альбому технических решений производителя.</p></div>
  <div class="grid2">
    <div class="card"><h2>Крепёж</h2><div class="tbl-wrap"><table><thead><tr><th>Наименование</th><th>Размер</th><th>Назначение</th><th class="n">Расчёт</th><th class="n">С запасом</th><th class="n">Упак.</th></tr></thead><tbody>
      ${R.fx.map((x) => `<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.size)}</td><td class="small">${esc(x.purpose)}<br><span class="muted">${esc(x.norm)}</span></td><td class="n">${fmt(x.qty)}</td><td class="n">${fmt(x.qtyRes)}</td><td class="n">${x.packs}×${x.pack}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="card"><h2>Уплотнители и герметики</h2><div class="tbl-wrap"><table><thead><tr><th>Наименование</th><th>Ед.</th><th class="n">Кол-во</th><th>Основание</th></tr></thead><tbody>
      ${R.seals.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.unit}</td><td class="n">${fmt(x.qty, x.unit === "м³" ? 2 : 0)}</td><td class="small muted">${esc(x.base)}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>`;
}

/* =================== УПАКОВКА =================== */
function tabPacks() {
  if (!R || !R.packs.length) return `<div class="card empty">Нет данных</div>`;
  const types = {};
  for (const p of R.packs.filter((x) => x.kind !== "fi")) { const k = `${p.kind === "roof" ? "Кровля" : "Стены"} ${p.t} мм`; types[k] = p.nByH; }
  return `
  <div class="card">
    <h2>Правила упаковки</h2>
    <div class="rules">
      ${Object.entries(types).map(([k, n]) => `<div class="rule"><b>${k}</b>до ${n} панелей в пачке (≤ ${fmt(P.pack.maxH)} мм, ≤ ${fmt(P.pack.maxKg)} кг)</div>`).join("")}
      <div class="rule"><b>Порядок в пачке</b>Снизу самая длинная, каждая следующая короче. Один тип и цвет на пачку. Пенопласт ${P.pack.foam / 2} мм сверху и снизу, плёнка.</div>
      <div class="rule"><b>Фасонка и крепёж</b>На поддонах ${fmt(P.fiPallet.L)} мм, до ${P.fiPallet.pcs} изделий и ${fmt(P.fiPallet.maxKg)} кг на поддон.</div>
    </div>
  </div>
  <div class="card"><h2>Ведомость пачек (${R.totals.packs} + ${R.totals.pallets} поддона)</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Пачка</th><th>Тип</th><th>Цвет</th><th class="n">Шт.</th><th class="n">Длины, мм</th><th class="n">Высота, мм</th><th class="n">м²</th><th class="n">Масса, кг</th><th>Содержимое</th><th class="n">Машина</th></tr></thead><tbody>
    ${R.packs.map((p) => `<tr><td class="mono"><b>${p.id}</b></td><td>${p.kind === "fi" ? "поддон ФИ" : (p.kind === "roof" ? "кровля " : "стена ") + p.t}</td><td>${p.color ? `<span class="sw" style="background:${ralHex(p.color)}"></span>${p.color}/${p.inner}` : "—"}</td><td class="n">${p.n || "—"}</td><td class="n">${p.lengths}</td><td class="n">${p.h}</td><td class="n">${p.area ? fmt(p.area, 1) : "—"}</td><td class="n">${fmt(p.kg)}</td><td class="small">${esc(p.content)}</td><td class="n"><b>${p.truck ?? "—"}</b></td></tr>`).join("")}
    </tbody></table></div>
  </div>`;
}

/* =================== МАШИНЫ =================== */
function truckSVG(tr, opts = {}) {
  const T = P.truck, cab = 2200, lanesN = tr.lanes.length, lw = T.W / lanesN;
  const fs = 220, Wv = T.L + cab + T.overhang + 600, Hv = T.W + 900;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -500 ${Wv} ${Hv}" font-family="IBM Plex Sans, Arial, sans-serif" role="img" aria-label="Схема загрузки машины ${tr.no}" style="color:${opts.print ? "#1C2126" : "var(--ink)"}">`;
  s += `<rect x="0" y="0" width="${cab - 200}" height="${T.W}" rx="260" fill="#5B646E"/><rect x="${cab - 1150}" y="180" width="700" height="${T.W - 360}" rx="80" fill="#9AA1A8"/>`;
  s += `<rect x="${cab}" y="0" width="${T.L}" height="${T.W}" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="40"/>`;
  s += `<text x="${cab}" y="-140" font-size="${fs}" fill="currentColor" fill-opacity="0.75">кабина →  кузов ${fmt(T.L)} × ${fmt(T.W)} мм</text>`;
  tr.lanes.forEach((lane, li) => {
    let x = cab;
    for (const st of lane) {
      const bottom = st.items[0], hex = bottom.kind === "fi" ? "#C9A86A" : ralHex(bottom.color);
      const tc = lum(hex) > 0.55 ? "#1C2126" : "#fff";
      const y = li * lw + 40, h = lw - 80;
      s += `<rect x="${x + 30}" y="${y}" width="${st.L - 60}" height="${h}" fill="${hex}" fill-opacity="0.85" stroke="#1C2126" stroke-width="30"/>`;
      const label = st.items.map((p) => p.id).join(" / ");
      const f = Math.min(fs * 1.1, (st.L - 200) / (label.length * 0.62));
      s += `<text x="${x + st.L / 2}" y="${y + h / 2 - f * 0.35}" font-size="${f}" fill="${tc}" text-anchor="middle" dominant-baseline="middle" font-weight="600">${esc(label)}</text>`;
      s += `<text x="${x + st.L / 2}" y="${y + h / 2 + f * 0.8}" font-size="${f * 0.75}" fill="${tc}" text-anchor="middle" dominant-baseline="middle">${st.items.length} яр. · ${fmt(st.L)} мм · ${fmt(st.kg)} кг</text>`;
      x += st.L;
    }
  });
  if (T.overhang) s += `<path d="M${cab + T.L} -60L${cab + T.L} ${T.W + 60}" stroke="#B3261E" stroke-width="20" stroke-dasharray="80 60"/>`;
  return s + `</svg>`;
}

async function saveFile(filename, data) {
  const dl = await cap("downloads");
  if (dl) {
    try { await dl.save({ filename, data }); toast("Файл передан на сохранение"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000); toast("Файл сохранён: " + filename);
  } catch (e) { toast("Не удалось сохранить файл в этом просмотре"); }
}
